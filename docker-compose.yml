services:
  api:
    build: ./api
    environment:
      PORT: 8080
      DATABASE_PATH: /data/nidhogg.db
      ALLOWED_ORIGIN: ${PUBLIC_WEB_URL:-http://localhost:3000}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-nidhogg-operator}
    ports:
      - "8080:8080"
    volumes:
      - nidhogg-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  nidhogg-data:
